name: Wise Systems
description: Wise Systems provides autonomous routing and last-mile delivery optimization
  software powered by machine learning. Its platform helps fleet operators plan strategy,
  optimize and dynamically re-route deliveries, dispatch in real time, track driver
  performance, and improve last-mile efficiency across industries including auto parts,
  beverage, building materials, container management, field service, food service,
  healthcare, linen services, parcel/courier, and retail. Wise Systems exposes an internal
  "Engine API" during customer implementations to connect data inputs and outputs, but
  publishes no public developer portal, API reference, or SDKs. Backed by Techstars and
  headquartered in Cambridge, Massachusetts.
